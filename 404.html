
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Subiendo ticket</title>

<style>
:root {
    --bg: #101010;
    --card: #171717;
    --orange: #ff8a24;
    --text: #f5f5f5;
    --muted: #a3a3a3;
    --border: #2b2b2b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
}

.container {
    width: 100%;
    max-width: 460px;
    text-align: center;
}

.brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
    font-size: 17px;
    font-weight: 700;
}

.brand-icon {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--orange);
    color: #111;
    font-size: 22px;
}

.card {
    padding: 38px 28px 30px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
}

.icon {
    width: 66px;
    height: 66px;
    display: grid;
    place-items: center;
    margin: 0 auto 24px;
    border-radius: 14px;
    background: #262019;
    border: 1px solid #443021;
    color: var(--orange);
    font-size: 30px;
}

h1 {
    font-size: clamp(24px, 5vw, 29px);
    letter-spacing: -.6px;
    margin-bottom: 14px;
}

.description {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
}

.status-box {
    margin-top: 26px;
    padding: 18px;
    background: #131313;
    border: 1px solid var(--border);
    border-radius: 12px;
}

.status {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
    font-size: 13px;
}

.spinner {
    width: 16px;
    height: 16px;
    border: 2px solid #49301d;
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

.track {
    height: 4px;
    background: #303030;
    border-radius: 8px;
    overflow: hidden;
}

.bar {
    width: 35%;
    height: 100%;
    background: var(--orange);
    animation: loading 2s ease-in-out infinite;
}

.notice {
    margin-top: 21px;
    color: #858585;
    font-size: 12px;
    line-height: 1.7;
}

.footer {
    margin-top: 25px;
    color: #777;
    font-size: 12px;
}

.footer span {
    color: var(--orange);
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes loading {
    0% { transform: translateX(-110%); }
    50% { transform: translateX(190%); }
    100% { transform: translateX(350%); }
}

@media (max-width: 480px) {
    .card {
        padding: 30px 20px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>
<main class="container">

    <div class="brand">
        <div class="brand-icon">F</div>
        FlameHosting
    </div>

    <section class="card">
        <div class="icon" aria-hidden="true">↑</div>

        <h1 id="title">Estamos subiendo tu ticket</h1>

        <p class="description" id="description">
            Tu ticket se está procesando. Espera unos minutos
            mientras comprobamos cuándo estará disponible.
        </p>

        <div class="status-box" id="status-box" role="status"
            aria-live="polite">
            <div class="status">
                <span class="spinner" id="spinner"></span>
                <span id="status-text">Esperando el ticket...</span>
            </div>

            <div class="track" id="track">
                <div class="bar"></div>
            </div>
        </div>

        <p class="notice" id="notice">
            No cierres esta página. Te llevaremos al ticket
            automáticamente cuando esté disponible.
        </p>
    </section>

    <footer class="footer">
        Gracias por tu paciencia. <span>FlameHosting</span>
    </footer>

</main>

<script>
(() => {
    const BASE_URL =
        "https://transcripts.flamehosting.es/transcript/";

    // Archivo que ya conoces.
    const START_NUMBER = 11;

    // Cada cuánto comprobar los archivos.
    const CHECK_INTERVAL = 5000;

    // Límite de archivos a revisar en cada búsqueda.
    const MAX_CHECKS = 20;

    let searching = false;
    let finished = false;

    const title = document.getElementById("title");
    const description = document.getElementById("description");
    const statusText = document.getElementById("status-text");
    const spinner = document.getElementById("spinner");
    const track = document.getElementById("track");
    const notice = document.getElementById("notice");

    /*
     * Comprueba si un archivo existe.
     * Se utiliza fetch para no recargar toda la página.
     */
    async function fileExists(url) {
        try {
            const response = await fetch(url, {
                method: "HEAD",
                cache: "no-store"
            });

            if (response.ok) return true;

            // Algunos servidores no permiten HEAD.
            if (response.status === 405 ||
                response.status === 501) {
                const fallback = await fetch(url, {
                    method: "GET",
                    cache: "no-store",
                    headers: { "Range": "bytes=0-0" }
                });

                return fallback.ok;
            }

            return false;
        } catch {
            return false;
        }
    }

    async function findNewTicket() {
        if (searching || finished) return;

        searching = true;
        statusText.textContent = "Buscando tu ticket...";

        try {
            /*
             * Busca números posteriores al archivo inicial.
             * El primero que encuentre será el destino.
             */
            for (let number = START_NUMBER + 1;
                 number <= START_NUMBER + MAX_CHECKS;
                 number++) {

                if (finished) return;

                const url = BASE_URL + "test-" + number + ".html";

                if (await fileExists(url)) {
                    finished = true;

                    title.textContent = "¡Tu ticket está listo!";
                    description.textContent =
                        "Hemos encontrado el nuevo transcript. " +
                        "Te estamos llevando a la página.";
                    statusText.textContent =
                        "Ticket encontrado correctamente";
                    spinner.style.display = "none";
                    track.style.display = "none";
                    notice.textContent =
                        "Si no se abre automáticamente, " +
                        "pulsa el botón para continuar.";

                    const link = document.createElement("a");
                    link.href = url;
                    link.textContent = "Abrir mi ticket";
                    link.style.cssText = `
                        display: inline-block;
                        margin-top: 18px;
                        padding: 12px 20px;
                        border-radius: 9px;
                        background: #ff8a24;
                        color: #111;
                        font-weight: 700;
                        font-size: 14px;
                        text-decoration: none;
                    `;

                    document.getElementById("status-box")
                        .appendChild(link);

                    // Pequeña pausa para mostrar el mensaje.
                    setTimeout(() => {
                        window.location.assign(url);
                    }, 1200);

                    return;
                }
            }

            statusText.textContent =
                "Todavía no aparece. Seguimos buscando...";
        } finally {
            searching = false;
        }
    }

    findNewTicket();
    setInterval(findNewTicket, CHECK_INTERVAL);
})();
</script>
</body>
</html>
